[project]
name = "radar-models"
version = "1.3.0"
description = "DB models for Radar"
authors = [{ name = "Andrew Atterton" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "sqlmodel>=0.0.48,<0.0.49",
    "pydantic>=2.6.3,<3.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.17.2,<0.18.0",
    "pytest>=7.4.4,<10.0.0",
    "faker>=16.9.0,<17.0.0",
    "tox>=4.14.1,<5.0.0",
    "mypy>=1.8.0,<2.0.0",
    "bandit>=1.7.7,<2.0.0",
]

[tool.poetry]
packages = [{ include = "radar_models" }]

[build-system]
requires = ["poetry-core>=2.2.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"