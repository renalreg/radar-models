[tox]
envlist = ruff, pytest, mypy, bandit

[testenv]
skip_install = true
allowlist_externals = poetry
commands_pre =
    poetry install

[testenv:ruff]
description = 'Check formatting and lint with Ruff.'
commands =
    poetry run ruff format --check radar_models/radar3.py
    poetry run ruff check radar_models/radar3.py

[testenv:pytest]
description = 'Run Python tests with pytest test runner.'
commands = poetry run pytest tests/

[testenv:mypy]
description = 'Execute static analysis with mypy.'
commands = poetry run mypy radar_models/radar3.py

[testenv:bandit]
description = 'Execute static analysis with bandit.'
commands = poetry run bandit -r radar_models/radar3.py